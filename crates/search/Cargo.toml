[package]
name = "sctx-search"
description = "Shared Context structured search and task retrieval boundary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sctx-domain.workspace = true
sctx-engineering-graph.workspace = true
sctx-index.workspace = true
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic", "ndarray"], optional = true }
tokenizers = { version = "0.23", default-features = false, features = ["onig"], optional = true }
ndarray = { version = "0.16", optional = true }

[features]
default = ["embedding-onnx"]
# ONNX Runtime is loaded dynamically at run time from the path `[retrieval]` names.
# Nothing is downloaded at build time and no runtime library is linked.
embedding-onnx = ["dep:ort", "dep:tokenizers", "dep:ndarray"]

[lints]
workspace = true

[dev-dependencies]
sctx-event-schema.workspace = true
sctx-git-store.workspace = true
tempfile = "3.20"
